<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python in the Browser Demo</title>

<!-- Skulpt: JS-based Python interpreter -->
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

<style>
  body {
    background: #0d0d0d;
    color: #33ff66;
    font-family: "Courier New", monospace;
    padding: 20px;
  }
  #run-btn {
    background: #eee;
    color: #111;
    border: none;
    padding: 6px 16px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
  }
  #output {
    white-space: pre-wrap;
    color: #cccccc;
    font-size: 18px;
    line-height: 1.6;
  }
  #input-line {
    display: none;
    margin-top: 10px;
  }
  #input-line input {
    background: #111;
    border: 1px solid #444;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    padding: 4px 8px;
  }
</style>
</head>
<body>

<button id="run-btn" onclick="runCode()">Run</button>
<div id="output"></div>

<div id="input-line">
  <input type="text" id="input-box" autofocus>
  <button onclick="submitInput()">Enter</button>
</div>

<script>
// The Python code that will run in-browser
const pythonCode = `
print("Welcome to the Band Name Generator.")
city = input("What is the name of the city you grew up in? ")
pet = input("What is your pet name? ")
print("Your band name could be " + city + " " + pet)
`;

let inputResolve = null;

function outf(text) {
  document.getElementById("output").innerText += text;
}

function builtinRead(x) {
  if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
    throw "File not found: '" + x + "'";
  return Sk.builtinFiles["files"][x];
}

// Custom input handler so it works in a browser (no native input() prompt)
function inputFromBrowser(promptText) {
  return new Promise((resolve) => {
    document.getElementById("output").innerText += promptText;
    const inputLine = document.getElementById("input-line");
    const inputBox = document.getElementById("input-box");
    inputLine.style.display = "block";
    inputBox.value = "";
    inputBox.focus();
    inputResolve = (val) => {
      document.getElementById("output").innerText += val + "\n";
      inputLine.style.display = "none";
      resolve(val);
    };
  });
}

function submitInput() {
  const val = document.getElementById("input-box").value;
  if (inputResolve) inputResolve(val);
}

document.getElementById("input-box").addEventListener("keydown", function(e) {
  if (e.key === "Enter") submitInput();
});

function runCode() {
  document.getElementById("output").innerText = "";
  Sk.configure({
    output: outf,
    read: builtinRead,
    inputfun: inputFromBrowser,
    inputfunTakesPrompt: true,
    __future__: Sk.python3
  });
  Sk.misceval.asyncToPromise(function() {
    return Sk.importMainWithBody("<stdin>", false, pythonCode, true);
  }).catch(function(err) {
    outf(err.toString());
  });
}
</script>

</body>
</html>
